# Battery ageing models — capacity loss only (resistance growth is not modelled, see DECISIONS D-013).
# Parameters are copied unchanged from the papers. Implementation cross-checked against SimSES
# (TU Munich, BSD-3 licence): v2.1.1 for the LFP model, v1.3.12 for the NMC model.
# All losses are fractions of the cell's rated capacity; calendar and cycle losses are added.

schmalstieg_nmc:
  # [SOURCE] Schmalstieg, Käbitz, Ecker, Sauer (2014), "A holistic aging model for Li(NiMnCo)O2 based
  # 18650 lithium-ion batteries", J. Power Sources 257, 325-334. Cell: Sanyo UR18650E, 2.05 Ah.
  label: Schmalstieg et al. 2014 (NMC)
  cell_capacity_ah: 2.05
  calendar:        # loss = alpha * t^0.75,  t in days,  T in kelvin,  V = open-circuit cell voltage
    # alpha = (a_v * V - b_v) * 1e6 * exp(-ea_over_r / T)
    a_v: 7.543
    b_v: 23.75
    ea_over_r_k: 6976.0
    time_exponent: 0.75
    v_floor: 3.149   # alpha is zero below this voltage (the fitted line crosses zero at 3.149 V); as in SimSES
  cycle:           # loss = beta * Q^0.5,  Q = charge throughput per cell in Ah (one half-cycle of depth d = d * 2.05 Ah)
    # beta = a * (V_avg - v_ref)^2 + b + c * DOD      (DOD as a fraction 0-1)
    a: 7.348e-3
    v_ref: 3.667
    b: 7.6e-4
    c: 4.081e-3
    throughput_exponent: 0.5
  # Open-circuit voltage vs SOC of the Sanyo UR18650E cell. [SOURCE] SimSES data file NMC_Sanyo_OCV.csv
  ocv_soc: [0.00124, 0.0165, 0.0347, 0.0529, 0.0677, 0.083, 0.0983, 0.113, 0.129, 0.15, 0.166, 0.19, 0.217,
            0.245, 0.276, 0.307, 0.34, 0.371, 0.41, 0.437, 0.468, 0.493, 0.525, 0.548, 0.574, 0.597, 0.62,
            0.648, 0.672, 0.699, 0.727, 0.753, 0.791, 0.823, 0.856, 0.883, 0.9, 0.919, 0.938, 0.958, 0.979, 0.999]
  ocv_v:   [3.33, 3.36, 3.40, 3.43, 3.45, 3.47, 3.49, 3.51, 3.53, 3.55, 3.56, 3.58, 3.59,
            3.61, 3.62, 3.63, 3.64, 3.65, 3.66, 3.67, 3.68, 3.70, 3.72, 3.73, 3.75, 3.77, 3.79,
            3.82, 3.84, 3.87, 3.89, 3.92, 3.96, 3.99, 4.03, 4.06, 4.07, 4.09, 4.11, 4.13, 4.14, 4.16]

naumann_lfp:
  # [SOURCE] Calendar: Naumann, Schimpe, Keil, Hesse, Jossen (2018), "Analysis and modeling of calendar
  # aging of a commercial LiFePO4/graphite cell", J. Energy Storage 17, 153-169.
  # [SOURCE] Cycle: Naumann, Spingler, Jossen (2020), "Analysis and modeling of cycle aging of a
  # commercial LiFePO4/graphite cell", J. Power Sources 451, 227666. Cell: Sony/Murata US26650FTC1, 3 Ah.
  label: Naumann et al. 2018/2020 (LFP)
  calendar:        # loss = k_T * k_SOC * t^0.5,  t in SECONDS
    # k_T = k_ref * exp(-ea / R * (1/T - 1/T_ref));  k_SOC = c_soc * (SOC - 0.5)^3 + d_soc
    k_ref: 1.2571e-5
    ea_j_per_mol: 17126.0
    t_ref_c: 25.0
    c_soc: 2.8575
    d_soc: 0.60225
    time_exponent: 0.5
  cycle:           # loss [%] = k_C * k_DOD * FEC^0.5   (divided by 100 in code)
    # k_C = a_c * C_rate + b_c;  k_DOD = c_dod * (DOD - 0.6)^3 + d_dod    (DOD as a fraction 0-1)
    a_c: 0.0630
    b_c: 0.0971
    c_dod: 4.0253
    d_dod: 1.0923
    fec_exponent: 0.5
